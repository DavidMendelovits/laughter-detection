[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laughter-detection"
version = "0.1.0"
description = "Detect laughter in video/audio files and output timestamped JSON results"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "jrgillick"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Video",
]
keywords = ["laughter", "detection", "audio", "video", "machine-learning"]
dependencies = [
    "moviepy>=1.0.3",
    "numpy>=1.21.0",
    "tensorflow>=2.10.0",
    "tensorflow-hub>=0.12.0",
    "resampy>=0.4.0",
    "scipy>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
laughter-detect = "laughter_detection.cli:main"

[project.urls]
Homepage = "https://github.com/jrgillick/laughter-detection"
Repository = "https://github.com/jrgillick/laughter-detection"
Issues = "https://github.com/jrgillick/laughter-detection/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["laughter_detection*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
